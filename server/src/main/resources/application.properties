spring.application.name=server
server.port=${PORT:8080}
spring.main.lazy-initialization=true

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME}?sslMode=VERIFY_IDENTITY&useSSL=true&requireSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

manager.auth.secret=${MANAGER_AUTH_SECRET}
manager.auth.token-ttl-millis=${MANAGER_AUTH_TOKEN_TTL_MILLIS:43200000}
user.auth.secret=${USER_AUTH_SECRET}
user.auth.token-ttl-millis=${USER_AUTH_TOKEN_TTL_MILLIS:43200000}
